# Checks every push to main and every pull request.
# Actions are pinned to a full commit SHA (the tag is in the comment). A tag can be moved. A SHA cannot.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # Nothing here needs to write. The jobs get no other permission.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, tests and self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the exact versions we tested
        run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples scripts
      - name: Tests
        run: python -m pytest -q
      - name: Self-test (does TrustBench measure correctly?)
        run: trustbench selftest

  example:
    name: Support agent example (the EDD story)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: The demo runs with no API key and ends the way the story says
        run: make edd-demo

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: The compose file is valid
        run: docker compose config --quiet
      - name: The image builds
        run: docker build --tag trustbench:ci .
      - name: The image starts and answers its health check
        run: |
          docker run --detach --name tb --publish 8000:8000 --env TRUSTBENCH_DATABASE_URL=sqlite:////tmp/ci.db trustbench:ci
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:8000/v1/health && exit 0; sleep 2; done
          docker logs tb
          exit 1

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
