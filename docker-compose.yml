# Users start the database with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustbench
      POSTGRES_PASSWORD: trustbench
      POSTGRES_DB: trustbench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
