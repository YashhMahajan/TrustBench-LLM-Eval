[project]
name = "trustbench"
version = "0.1.0"
description = "Evaluate LLMs. Set one API key and run."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4.20",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "cryptography>=42",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
redis = ["redis>=5"]

[project.scripts]
trustbench = "trustbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient", "error::pytest.PytestUnhandledThreadExceptionWarning"]

# Rules that find real bugs: unused names, late-binding closures, hidden exceptions, unsafe patterns.
# B008/B904/B905 are off on purpose: typer needs calls in defaults, the CLI and API turn errors into exit codes
# and HTTP answers, and our zip() calls pair lists that are built to be equal in length.
[tool.ruff.lint]
select = ["F", "B", "S", "E9"]
ignore = ["B008", "B904", "B905", "S101", "S311", "S110", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
