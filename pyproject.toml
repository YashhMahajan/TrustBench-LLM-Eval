[project]
name = "trustbench"
version = "0.1.0"
description = "Evaluate LLMs. Set one API key and run."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "jsonschema>=4.20",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
redis = ["redis>=5"]

[project.scripts]
trustbench = "trustbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
